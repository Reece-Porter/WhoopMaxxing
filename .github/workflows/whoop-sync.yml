name: Whoop sync

on:
  schedule:
    - cron: '17 */3 * * *' # every 3 hours (runs on the default branch)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: whoop-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pull data from Whoop API
        run: node scripts/whoop-sync.mjs
        env:
          WHOOP_CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
          WHOOP_CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
          WHOOP_REFRESH_TOKEN: ${{ secrets.WHOOP_REFRESH_TOKEN }}
          WHOOP_TOKEN_KEY: ${{ secrets.WHOOP_TOKEN_KEY }}

      - name: Commit updated data
        run: |
          git config user.name "whoop-sync[bot]"
          git config user.email "whoop-sync@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: sync Whoop data"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
