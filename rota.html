<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rota · ShiftMaxx</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23171512'/><path d='M17.5 3 7 17h5.5L11 29 22 14h-5.5L17.5 3z' fill='%23d9a441'/></svg>">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="rota">
  <header class="top" id="app-header"></header>
  <div class="today-strip" id="today-strip"></div>

  <main class="wrap">
    <h1>Rota</h1>
    <p class="sub">4 nights → 4 off → 4 days → 4 off, repeating every 16 days from 19 July 2026. Nights 19:00–07:00, days 07:00–19:00.</p>

    <p id="rota-summary" class="card" style="font-size:14px"></p>

    <div class="legend" aria-hidden="false">
      <span class="key"><span class="swatch" style="background:var(--shift-night)"></span> Night shift</span>
      <span class="key"><span class="swatch" style="background:var(--shift-day)"></span> Day shift</span>
      <span class="key"><span class="swatch" style="background:var(--surface-2);border:1px solid var(--border)"></span> Off</span>
    </div>

    <div class="cal-head">
      <h2 id="cal-title"></h2>
      <div style="display:flex;gap:6px">
        <button id="cal-prev" aria-label="Previous month">←</button>
        <button id="cal-today">Today</button>
        <button id="cal-next" aria-label="Next month">→</button>
      </div>
    </div>
    <div class="cal-grid" id="cal-grid"></div>

    <p class="notice" style="margin-top:16px">To change the pattern or start date, edit <code>ROTA</code> at the top of <code>assets/js/shifts.js</code>.</p>
  </main>

  <script src="assets/js/shifts.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/rota.js"></script>
</body>
</html>
